[project]
name = "spooky-fasttext"
version = "0.1.0"
# fasttext-wheel ships prebuilt wheels only up to CPython 3.12
requires-python = ">=3.11,<3.13"
dependencies = [
    "fasttext-wheel>=0.9.2",
    "mlflow>=2.0",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "psutil>=5.9",
    "scikit-learn>=1.4",
]
